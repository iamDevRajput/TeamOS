name: teamos

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamos_owner
      POSTGRES_PASSWORD: teamos_local_password
      POSTGRES_DB: teamos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamos_owner -d teamos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

